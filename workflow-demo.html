<!-- Workflow Demo Widget - Safe for Elementor -->
<div class="dagflux-workflow-demo-wrapper">
    <div class="dagflux-workflow-container">
        <!-- Workflow Header -->
        <div class="dagflux-workflow-header">
            <svg class="dagflux-workflow-icon" viewBox="0 0 24 24">
                <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20M12,19L8,15H10.5V12H13.5V15H16L12,19Z"/>
            </svg>
            <div class="dagflux-workflow-title">Customer Analytics Pipeline</div>
        </div>

        <!-- Canvas Area -->
        <div class="dagflux-canvas-area" id="dagfluxCanvas">
            <svg class="dagflux-connections" id="dagfluxConnections"></svg>
            <div class="dagflux-nodes-container" id="dagfluxNodes"></div>
        </div>

        <!-- Status Bar -->
        <div class="dagflux-status-bar">
            <div class="dagflux-status-indicator">
                <div class="dagflux-status-dot"></div>
                <span id="dagfluxStatus">Building workflow...</span>
            </div>
        </div>
    </div>
</div>

<style>
    /* Scoped styles - only affects .dagflux-workflow-demo-wrapper */
    .dagflux-workflow-demo-wrapper {
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
    }

    .dagflux-workflow-demo-wrapper * {
        box-sizing: border-box;
    }

    .dagflux-workflow-container {
        width: 100%;
        height: 600px;
        background: #fafafa;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .dagflux-workflow-header {
        padding: 16px;
        border-bottom: 1px solid #e0e0e0;
        background: #ffffff;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .dagflux-workflow-icon {
        width: 24px;
        height: 24px;
        fill: #1976d2;
        flex-shrink: 0;
    }

    .dagflux-workflow-title {
        font-size: 16px;
        font-weight: 600;
        color: rgba(0, 0, 0, 0.87);
    }

    .dagflux-canvas-area {
        flex: 1;
        position: relative;
        overflow: hidden;
        background:
            linear-gradient(0deg, transparent 24%, rgba(0, 0, 0, 0.03) 25%, rgba(0, 0, 0, 0.03) 26%, transparent 27%, transparent 74%, rgba(0, 0, 0, 0.03) 75%, rgba(0, 0, 0, 0.03) 76%, transparent 77%, transparent),
            linear-gradient(90deg, transparent 24%, rgba(0, 0, 0, 0.03) 25%, rgba(0, 0, 0, 0.03) 26%, transparent 27%, transparent 74%, rgba(0, 0, 0, 0.03) 75%, rgba(0, 0, 0, 0.03) 76%, transparent 77%, transparent);
        background-size: 50px 50px;
    }

    .dagflux-connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
    }

    .dagflux-nodes-container {
        position: relative;
        width: 100%;
        height: 100%;
        z-index: 2;
    }

    .dagflux-node {
        position: absolute;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 16px;
        min-width: 180px;
        opacity: 0;
        transform: scale(0.8);
        animation: dagfluxNodeAppear 0.4s ease-out forwards;
    }

    @keyframes dagfluxNodeAppear {
        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    .dagflux-node-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
    }

    .dagflux-node-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
    }

    .dagflux-node-icon.source {
        fill: #4caf50;
    }

    .dagflux-node-icon.transform {
        fill: #ff9800;
    }

    .dagflux-node-icon.join {
        fill: #9c27b0;
    }

    .dagflux-node-icon.output {
        fill: #2196f3;
    }

    .dagflux-node-title {
        font-weight: 600;
        font-size: 14px;
        color: rgba(0, 0, 0, 0.87);
    }

    .dagflux-node-content {
        font-size: 12px;
        color: rgba(0, 0, 0, 0.6);
        line-height: 1.4;
    }

    .dagflux-node-badge {
        display: inline-block;
        background: #e3f2fd;
        color: #1976d2;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 500;
        margin-top: 8px;
    }

    .dagflux-connection-line {
        stroke: #1976d2;
        stroke-width: 2;
        fill: none;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: dagfluxDrawLine 0.6s ease-out forwards;
    }

    @keyframes dagfluxDrawLine {
        to {
            stroke-dashoffset: 0;
        }
    }

    .dagflux-connection-arrow {
        fill: #1976d2;
        opacity: 0;
        animation: dagfluxArrowAppear 0.3s ease-out 0.4s forwards;
    }

    @keyframes dagfluxArrowAppear {
        to {
            opacity: 1;
        }
    }

    .dagflux-status-bar {
        padding: 12px 16px;
        border-top: 1px solid #e0e0e0;
        background: #ffffff;
    }

    .dagflux-status-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: rgba(0, 0, 0, 0.6);
    }

    .dagflux-status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4caf50;
        animation: dagfluxPulse 2s ease-in-out infinite;
    }

    @keyframes dagfluxPulse {
        0%, 100% {
            opacity: 1;
            transform: scale(1);
        }
        50% {
            opacity: 0.5;
            transform: scale(1.2);
        }
    }

    .dagflux-status-dot.complete {
        background: #4caf50;
        animation: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .dagflux-workflow-container {
            height: 500px;
        }

        .dagflux-node {
            min-width: 140px;
            padding: 12px;
        }

        .dagflux-node-title {
            font-size: 12px;
        }

        .dagflux-node-content {
            font-size: 11px;
        }
    }
</style>

<script>
    (function() {
        'use strict';

        // Workflow configuration - easy to edit
        const WORKFLOW_STEPS = [
            {
                id: 'source1',
                type: 'source',
                title: 'PostgreSQL',
                content: 'customers table\n5.2M records',
                badge: 'Database',
                position: { top: 80, left: 50 },
                delay: 500
            },
            {
                id: 'source2',
                type: 'source',
                title: 'Google Sheets',
                content: 'product_catalog\n1,245 items',
                badge: 'Spreadsheet',
                position: { top: 280, left: 50 },
                delay: 1200
            },
            {
                id: 'transform1',
                type: 'transform',
                title: 'Transform',
                content: 'Filter active customers\nCalculate lifetime value',
                badge: 'AI-Powered',
                position: { top: 80, left: 320 },
                delay: 1900,
                connections: ['source1']
            },
            {
                id: 'join1',
                type: 'join',
                title: 'Join',
                content: 'INNER JOIN on\ncustomer_id',
                badge: 'SQL',
                position: { top: 180, left: 590 },
                delay: 2600,
                connections: ['transform1', 'source2']
            },
            {
                id: 'output1',
                type: 'output',
                title: 'BigQuery',
                content: 'analytics.customer_insights\n4.8M records loaded',
                badge: 'Data Warehouse',
                position: { top: 180, left: 820 },
                delay: 3300,
                connections: ['join1']
            }
        ];

        const nodesContainer = document.getElementById('dagfluxNodes');
        const connectionsSvg = document.getElementById('dagfluxConnections');
        const statusText = document.getElementById('dagfluxStatus');
        const nodePositions = {};

        // Node icons (SVG paths)
        const NODE_ICONS = {
            source: '<path d="M4,6H2V20H2A2,2 0 0,0 4,22H18V20H4V6M20,2H8A2,2 0 0,0 6,4V16A2,2 0 0,0 8,18H20A2,2 0 0,0 22,16V4A2,2 0 0,0 20,2M20,16H8V4H20V16M16,20V22H18V20H16M12,20V22H14V20H12M8,20V22H10V20H8Z"/>',
            transform: '<path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/>',
            join: '<path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"/>',
            output: '<path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20M12,19L8,15H10.5V12H13.5V15H16L12,19Z"/>'
        };

        // Create a node element
        function createNode(step) {
            const node = document.createElement('div');
            node.className = 'dagflux-node';
            node.id = step.id;
            node.style.top = step.position.top + 'px';
            node.style.left = step.position.left + 'px';
            node.style.animationDelay = step.delay + 'ms';

            node.innerHTML = `
                <div class="dagflux-node-header">
                    <svg class="dagflux-node-icon ${step.type}" viewBox="0 0 24 24">
                        ${NODE_ICONS[step.type]}
                    </svg>
                    <div class="dagflux-node-title">${step.title}</div>
                </div>
                <div class="dagflux-node-content">${step.content}</div>
                <div class="dagflux-node-badge">${step.badge}</div>
            `;

            // Store position for connection drawing
            nodePositions[step.id] = {
                x: step.position.left + 90, // center x
                y: step.position.top + 45   // center y
            };

            return node;
        }

        // Draw connection between two nodes
        function drawConnection(fromId, toId, delay) {
            const from = nodePositions[fromId];
            const to = nodePositions[toId];

            if (!from || !to) return;

            const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            group.style.animationDelay = delay + 'ms';

            // Calculate control points for curved line
            const midX = (from.x + to.x) / 2;
            const path = `M ${from.x} ${from.y} Q ${midX} ${from.y}, ${midX} ${(from.y + to.y) / 2} T ${to.x} ${to.y}`;

            // Create path
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            line.setAttribute('d', path);
            line.setAttribute('class', 'dagflux-connection-line');
            line.style.animationDelay = delay + 'ms';

            // Create arrow
            const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            const arrowSize = 6;
            const angle = Math.atan2(to.y - from.y, to.x - from.x);
            const arrowX = to.x - 90; // offset to end at node edge
            const arrowY = to.y;

            const points = [
                [arrowX, arrowY],
                [arrowX - arrowSize * 2 * Math.cos(angle - Math.PI / 6), arrowY - arrowSize * 2 * Math.sin(angle - Math.PI / 6)],
                [arrowX - arrowSize * 2 * Math.cos(angle + Math.PI / 6), arrowY - arrowSize * 2 * Math.sin(angle + Math.PI / 6)]
            ];

            arrow.setAttribute('points', points.map(p => p.join(',')).join(' '));
            arrow.setAttribute('class', 'dagflux-connection-arrow');
            arrow.style.animationDelay = (delay + 400) + 'ms';

            group.appendChild(line);
            group.appendChild(arrow);
            connectionsSvg.appendChild(group);
        }

        // Update status text
        function updateStatus(text, isComplete = false) {
            statusText.textContent = text;
            const dot = document.querySelector('.dagflux-status-dot');
            if (isComplete && dot) {
                dot.classList.add('complete');
            }
        }

        // Build workflow
        async function buildWorkflow() {
            if (!nodesContainer || !connectionsSvg) {
                return;
            }

            for (let i = 0; i < WORKFLOW_STEPS.length; i++) {
                const step = WORKFLOW_STEPS[i];

                // Add node
                setTimeout(() => {
                    const node = createNode(step);
                    nodesContainer.appendChild(node);

                    // Update status
                    const statusMessages = [
                        'Connecting to PostgreSQL...',
                        'Loading Google Sheets data...',
                        'AI generating transformation...',
                        'Joining datasets...',
                        'Loading to BigQuery...'
                    ];
                    if (i < statusMessages.length) {
                        updateStatus(statusMessages[i]);
                    }
                }, step.delay);

                // Draw connections
                if (step.connections) {
                    step.connections.forEach((fromId) => {
                        setTimeout(() => {
                            drawConnection(fromId, step.id, step.delay + 200);
                        }, step.delay + 200);
                    });
                }
            }

            // Mark complete
            const lastStep = WORKFLOW_STEPS[WORKFLOW_STEPS.length - 1];
            setTimeout(() => {
                updateStatus('✓ Pipeline complete - 4.8M records processed', true);
            }, lastStep.delay + 1000);
        }

        // Initialize when container is in view
        function initWorkflow() {
            const container = document.querySelector('.dagflux-workflow-container');

            if (!container) {
                return;
            }

            // Create Intersection Observer
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        buildWorkflow();
                        observer.disconnect();
                    }
                });
            }, {
                threshold: 0.4
            });

            observer.observe(container);
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initWorkflow);
        } else {
            initWorkflow();
        }

    })();
</script>
