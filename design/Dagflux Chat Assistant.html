<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dagflux — Chat Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #f7f9fc;
    color: #111827;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  #root { height: 100%; overflow: hidden; visibility: hidden; }
  #root.ready { visibility: visible; }
  #chat-root { position: fixed; inset: 0; pointer-events: none; z-index: 1000; }
  #chat-root > * { pointer-events: auto; }

  /* typing dots */
  @keyframes dgblink { 0%,80%,100% { opacity: 0.25; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }

  /* nicer scrollbars in chat */
  #chat-root *::-webkit-scrollbar { width: 8px; height: 8px; }
  #chat-root *::-webkit-scrollbar-track { background: transparent; }
  #chat-root *::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
  #chat-root *::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

  #chat-root button:focus-visible,
  #chat-root input:focus-visible,
  #chat-root textarea:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="chat-root"></div>

<!-- React -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Dagflux app (workflow canvas as backdrop) -->
<script type="text/babel" src="dagflux-shared.jsx"></script>
<script type="text/babel" src="dagflux-nodes.jsx"></script>
<script type="text/babel" src="dagflux-panel.jsx"></script>
<script type="text/babel" src="dagflux-main.jsx"></script>

<!-- Chat assistant (mounts to #chat-root, overlays the app) -->
<script type="text/babel" src="dagflux-chat-v2.jsx"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => { document.getElementById('root').classList.add('ready'); }, 200);
  });
</script>
</body>
</html>
