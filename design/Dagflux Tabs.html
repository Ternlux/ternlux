  edit:     (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,

  play:     (c,s)=><svg width={s} height={s} viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill={c}/></svg>,
  reload:   (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>,
  check:    (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>,
  x:        (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
  clock:    (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
  eye:      (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
  db:       (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></svg>,
  file:     (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>,
  cal:      (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
  user:     (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
  node:     (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><line x1="12" y1="8" x2="5" y2="16"/><line x1="12" y1="8" x2="19" y2="16"/></svg>,
  table:    (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9" x2="9" y2="21"/></svg>,
  compass:  (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>,
  zap:      (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill={c} stroke={c} strokeWidth="1"/></svg>,
  spin:     (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
  chevron:  (c,s)=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><polyline points="6 9 12 15 18 9"/></svg>,
};
const I = (name, color=C.muted, size=14) => icons[name]?.(color,size) ?? null;

// ── Shared primitives ─────────────────────────────────────────────
const Btn = ({children, variant='ghost', size='sm', icon, onClick, style={}}) => {
  const [hov, setHov] = useState(false);
  const pad = size==='sm' ? '5px 10px' : '7px 14px';
  const fs  = size==='sm' ? 12 : 13;
  const base = {
    display:'inline-flex', alignItems:'center', gap:5,
    padding:pad, borderRadius:4, cursor:'pointer',
    fontSize:fs, fontWeight:500, fontFamily:SANS,
    border:'none', transition:'all 0.15s', whiteSpace:'nowrap',
  };
  const styles = {
    ghost:   { background: hov?C.surface:'#fff', border:`1px solid ${C.border}`,  color: hov?C.text:C.muted },
    primary: { background: hov?'#1d4ed8':C.accent, border:`1px solid transparent`, color:'#fff', fontWeight:600 },
    danger:  { background: hov?C.rD:'transparent', border:`1px solid transparent`, color:C.red },
  };
  return (
    <button style={{...base,...styles[variant],...style}}
      onMouseOver={()=>setHov(true)} onMouseOut={()=>setHov(false)} onClick={onClick}>
      {icon && I(icon, variant==='primary'?'#fff':variant==='danger'?C.red:hov?C.text:C.muted, 12)}
      {children}
    </button>
  );
};

const Tag = ({children, color, bg, border}) => (
  <span style={{display:'inline-block', padding:'2px 7px', borderRadius:3,
    fontSize:10, fontWeight:600, fontFamily:MONO, letterSpacing:'0.04em',
    color, background:bg, border:`1px solid ${border}`}}>
    {children}
  </span>
);

const MetaItem = ({icon:ic, children}) => (
  <span style={{display:'flex', alignItems:'center', gap:4, fontSize:11, color:C.muted}}>
    {I(ic, C.dim, 11)}{children}
  </span>
);

// ── Dropdown menu ─────────────────────────────────────────────────
const Menu = ({items}) => (
  <div style={{position:'absolute', top:'100%', right:0, zIndex:200, marginTop:4,
    background:'#fff', border:`1px solid ${C.border}`, borderRadius:6,
    boxShadow:'0 8px 24px rgba(0,0,0,0.1)', minWidth:160, overflow:'hidden'}}>
    {items.map((item,i) => item === '---'
      ? <div key={i} style={{height:1, background:C.border, margin:'2px 0'}}/>
      : (
        <button key={i} onClick={item.onClick}
          style={{display:'flex', alignItems:'center', gap:8, width:'100%', padding:'8px 12px',
            background:'none', border:'none', cursor:'pointer', fontSize:12, fontFamily:SANS,
            color: item.danger ? C.red : C.text, textAlign:'left'}}
          onMouseOver={e=>e.currentTarget.style.background=item.danger?C.rD:C.surface}
          onMouseOut={e=>e.currentTarget.style.background='none'}>
          {item.icon && I(item.icon, item.danger?C.red:C.muted, 12)}
          {item.label}
        </button>
      )
    )}
  </div>
);

const MoreMenu = ({items}) => {
  const [open, setOpen] = useState(false);
  const ref = useRef();
  React.useEffect(() => {
    const handler = e => { if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  },[]);
  return (
    <div ref={ref} style={{position:'relative', flexShrink:0}}>
      <button onClick={e=>{e.stopPropagation();setOpen(o=>!o);}}
        style={{display:'flex', alignItems:'center', justifyContent:'center',
          width:24, height:24, borderRadius:4, border:'none', background:'none',
          cursor:'pointer', color:C.dim, transition:'background 0.15s'}}
        onMouseOver={e=>e.currentTarget.style.background=C.s2}
        onMouseOut={e=>e.currentTarget.style.background='none'}>
        {I('more', C.dim, 14)}
      </button>
      {open && <Menu items={items.map(it=>({...it, onClick:()=>{setOpen(false);it.onClick?.();}}))}/>}
    </div>
  );
};

// ── Page header ───────────────────────────────────────────────────
const PageHeader = ({title, sub, actions}) => (
  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center',
    padding:'20px 24px', background:'#fff', borderBottom:`1px solid ${C.border}`, flexShrink:0}}>
    <div>
      <div style={{fontSize:14, fontWeight:700, color:C.text, letterSpacing:'-0.02em'}}>{title}</div>
      <div style={{fontSize:12, color:C.muted, marginTop:2}}>{sub}</div>
    </div>
    <div style={{display:'flex', gap:8}}>{actions}</div>
  </div>
);

  { id:4, name:'Churn Prediction Prep', description:'Feature engineering pipeline for ML model — cleans, normalises, and outputs training CSV.', nodeCount:11, type:'ml-prep', createdBy:'p.mehta', createdAt:'Feb 20', lastRun:null },
  { id:5, name:'Finance Export ETL', description:'Extract from Postgres, validate schema, load into warehouse with audit log.', nodeCount:7, type:'etl', createdBy:'a.sousa', createdAt:'Jan 31', lastRun:'1 week ago' },

];

const TYPE_COLORS = {
  transformation: { color:C.accent,  bg:C.aD,          border:'rgba(37,99,235,0.18)' },
  aggregation:    { color:C.violet,  bg:C.vD,          border:'rgba(124,58,237,0.18)' },
  reconciliation: { color:C.amber,   bg:C.amD,         border:'rgba(217,119,6,0.18)' },

  etl:            { color:C.green,   bg:C.gD,          border:'rgba(5,150,105,0.18)' },
  cleaning:       { color:'#db2777', bg:'rgba(219,39,119,0.06)', border:'rgba(219,39,119,0.18)' },

const WorkflowCard = ({wf}) => {
  const [hov, setHov] = useState(false);
  const tc = TYPE_COLORS[wf.type] || TYPE_COLORS.etl;
  return (
    <div onMouseOver={()=>setHov(true)} onMouseOut={()=>setHov(false)}
      style={{background:'#fff', border:`1px solid ${hov?C.border2:C.border}`,
        borderRadius:6, overflow:'hidden', cursor:'pointer', transition:'all 0.15s',
        boxShadow: hov?'0 4px 16px rgba(0,0,0,0.07)':'0 1px 3px rgba(0,0,0,0.04)',
        display:'flex', flexDirection:'column'}}>
      {/* Card header */}
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'12px 14px', borderBottom:`1px solid ${C.border}`, gap:8}}>
        <span style={{fontSize:13, fontWeight:600, color:C.text, letterSpacing:'-0.02em',
          overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', flex:1}}>
          {wf.name}
        </span>
        <MoreMenu items={[
          {label:'Run Workflow', icon:'play', onClick:()=>{}},
          {label:'Edit',        icon:'edit', onClick:()=>{}},
          '---',
          {label:'Delete',      icon:'trash', danger:true, onClick:()=>{}},
        ]}/>
      </div>
      {/* Body */}
      <div style={{padding:'12px 14px', flex:1, display:'flex', flexDirection:'column', gap:12}}>
        <div style={{fontSize:12, color:C.muted, lineHeight:1.55,
          display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', overflow:'hidden'}}>
          {wf.description}
        </div>
        {/* Meta row */}
        <div style={{display:'flex', gap:14, flexWrap:'wrap'}}>
          <MetaItem icon="node">{wf.nodeCount} nodes</MetaItem>
          <MetaItem icon="user">{wf.createdBy}</MetaItem>
          <MetaItem icon="cal">{wf.createdAt}</MetaItem>
        </div>
        {/* Footer */}
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:'auto', paddingTop:4}}>
          <Tag {...tc}>{wf.type}</Tag>
          {wf.lastRun
            ? <span style={{fontSize:11, color:C.dim, fontFamily:MONO}}>ran {wf.lastRun}</span>
            : <span style={{fontSize:11, color:C.dim, fontFamily:MONO}}>never run</span>}
        </div>
      </div>
    </div>
  );
};

const WorkflowsTab = () => (
  <div style={{display:'flex', flexDirection:'column', height:'100%', overflow:'hidden'}}>
    <PageHeader
      title="Workflows"
      sub="Create and manage your data processing workflows"
      actions={[
        <Btn key="imp" icon="import" onClick={()=>{}}>Import</Btn>,
        <Btn key="new" variant="primary" icon="plus" onClick={()=>{}}>Create Workflow</Btn>,

            ))}
          </div>
          {filtered.length === 0 ? (
            <div style={{padding:'40px 16px', textAlign:'center', color:C.dim, fontSize:12}}>
              No executions match the current filters
            </div>
          ) : filtered.map(ex => (
            <ExecutionRow key={ex.id} ex={ex} onSelect={setSelected}
              selected={selected?.id}/>
          ))}
        </div>
        {/* result count */}
        {filtered.length > 0 && (
          <div style={{fontSize:11, color:C.dim, fontFamily:MONO, textAlign:'right'}}>
            {filtered.length} of {EXECUTIONS.length} executions
          </div>
        )}
      </div>

      {/* Detail panel */}
      {selected && <DetailPanel ex={selected} onClose={()=>setSelected(null)}/>}
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════════
// CONNECTIONS TAB
// ═══════════════════════════════════════════════════════════════════

const CONNECTIONS = [
  { id:'c1', name:'orders_production', description:'Primary orders database — 45k+ rows, updated every 15 min.', type:'database', dbType:'postgres', host:'db.prod.internal', database:'orders_db', createdAt:'Mar 14, 2026' },
  { id:'c2', name:'customers.csv',     description:'Customer master list exported from CRM, refreshed weekly.', type:'file', fileType:'csv', originalName:'customers_export_2026.csv', fileSize:2.4, createdAt:'Mar 10, 2026' },
  { id:'c3', name:'analytics_warehouse', description:'Redshift-compatible DW for BI dashboards and reporting.', type:'database', dbType:'mssql', host:'wh.analytics.corp', database:'analytics', createdAt:'Feb 28, 2026' },
  { id:'c4', name:'inventory.sqlite',  description:'Local SQLite snapshot of warehouse inventory system.', type:'file', fileType:'sqlite', originalName:'inventory_snapshot.sqlite', fileSize:18.7, createdAt:'Feb 14, 2026' },
  { id:'c5', name:'events_raw.parquet', description:'Raw event stream data from product analytics pipeline.', type:'file', fileType:'parquet', originalName:'events_2026_q1.parquet', fileSize:340, createdAt:'Jan 31, 2026' },
  { id:'c6', name:'shopify_store',     description:'Shopify connector via API — orders, products, customers.', type:'api', apiType:'shopify', createdAt:'Jan 15, 2026' },
];

const CONN_TYPE_CFG = {
  postgres: { label:'PostgreSQL', color:C.accent,  bg:C.aD,  border:'rgba(37,99,235,0.18)' },
  mssql:    { label:'SQL Server', color:'#0078d4', bg:'rgba(0,120,212,0.07)', border:'rgba(0,120,212,0.2)' },
  csv:      { label:'CSV',        color:C.amber,   bg:C.amD, border:'rgba(217,119,6,0.18)' },
  sqlite:   { label:'SQLite',     color:C.cyan,    bg:C.cD,  border:'rgba(8,145,178,0.18)' },
  parquet:  { label:'Parquet',    color:C.violet,  bg:C.vD,  border:'rgba(124,58,237,0.18)' },
  shopify:  { label:'Shopify',    color:C.green,   bg:C.gD,  border:'rgba(5,150,105,0.18)' },
};

const ConnIcon = ({conn}) => {
  const isFile = conn.type === 'file';
  const isDb   = conn.type === 'database';
  const color  = isDb ? C.accent : isFile ? C.cyan : C.green;
  return (
    <div style={{width:32, height:32, borderRadius:5, flexShrink:0,
      background: isDb ? C.aD : isFile ? C.cD : C.gD,
      border:`1px solid ${isDb?'rgba(37,99,235,0.2)':isFile?'rgba(8,145,178,0.2)':'rgba(5,150,105,0.2)'}`,
      display:'flex', alignItems:'center', justifyContent:'center'}}>
      {I(isDb||conn.type==='api'?'db':'file', color, 15)}
    </div>
  );
};

const ConnectionCard = ({conn}) => {
  const [hov, setHov] = useState(false);
  const subType = conn.dbType || conn.fileType || conn.apiType || 'file';
  const tc = CONN_TYPE_CFG[subType] || {label:subType, color:C.muted, bg:C.s2, border:C.border};
  return (
    <div onMouseOver={()=>setHov(true)} onMouseOut={()=>setHov(false)}
      style={{background:'#fff', border:`1px solid ${hov?C.border2:C.border}`,
        borderRadius:6, overflow:'hidden', cursor:'pointer', transition:'all 0.15s',
        boxShadow: hov?'0 4px 16px rgba(0,0,0,0.07)':'0 1px 3px rgba(0,0,0,0.04)',
        display:'flex', flexDirection:'column'}}>
      {/* Card header */}
      <div style={{display:'flex', alignItems:'center', gap:10, padding:'12px 14px',
        borderBottom:`1px solid ${C.border}`}}>
        <ConnIcon conn={conn}/>
        <span style={{fontSize:13, fontWeight:600, color:C.text, letterSpacing:'-0.02em',
          overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', flex:1}}>
          {conn.name}
        </span>
        <MoreMenu items={[
          {label:'Edit',            icon:'edit',    onClick:()=>{}},
          ...(conn.type==='database'?[{label:'Explore DB', icon:'compass', onClick:()=>{}}]:[]),
          ...(conn.type!=='database'?[{label:'Preview Data', icon:'eye',   onClick:()=>{}}]:[]),
          '---',
          {label:'Delete', icon:'trash', danger:true, onClick:()=>{}},
        ]}/>
      </div>
      {/* Body */}
      <div style={{padding:'12px 14px', flex:1, display:'flex', flexDirection:'column', gap:10}}>
        <div style={{fontSize:12, color:C.muted, lineHeight:1.55,
          display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', overflow:'hidden'}}>
          {conn.description}
        </div>
        {/* Details */}
        <div style={{fontSize:11, color:C.muted, fontFamily:MONO, lineHeight:1.8}}>
          {conn.type==='database' && conn.host && <div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>host: {conn.host}</div>}
          {conn.database && <div>db: {conn.database}</div>}
          {conn.originalName && <div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>file: {conn.originalName}</div>}
          {conn.fileSize && <div>size: {conn.fileSize} MB</div>}
          {conn.apiType && <div>via: REST API</div>}
        </div>
        {/* Footer */}
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:'auto', paddingTop:4}}>
          <Tag {...tc}>{tc.label}</Tag>
          <span style={{fontSize:11, color:C.dim, fontFamily:MONO}}>{conn.createdAt}</span>
        </div>
      </div>
    </div>
  );
};

const ConnectionsTab = () => (
  <div style={{display:'flex', flexDirection:'column', height:'100%', overflow:'hidden'}}>
    <PageHeader
      title="Data Source Connections"
      sub="Manage spreadsheet uploads and database connections"
      actions={[<Btn key="new" variant="primary" icon="plus" onClick={()=>{}}>New Connection</Btn>]}/>
    <div style={{flex:1, overflow:'auto', padding:24}}>
      <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:16}}>
        {CONNECTIONS.map(conn => <ConnectionCard key={conn.id} conn={conn}/>)}
      </div>
    </div>
  </div>
);

// ═══════════════════════════════════════════════════════════════════
// ROOT — Tab shell matching Dagflux app chrome
// ═══════════════════════════════════════════════════════════════════

const TABS = [
  { id:'workflows',   label:'Workflows' },
  { id:'executions',  label:'Executions' },
  { id:'connections', label:'Connections' },
];

const App = () => {
  const [tab, setTab] = useState('workflows');
  return (
    <div style={{display:'flex', flexDirection:'column', height:'100vh', fontFamily:SANS, overflow:'hidden'}}>
      {/* Topbar */}
      <div style={{height:48, background:'#fff', borderBottom:`1px solid ${C.border}`,
        display:'flex', alignItems:'center', padding:'0 16px', gap:12, flexShrink:0, zIndex:50}}>
        <a href="homepage.html" style={{fontSize:14, fontWeight:700, color:C.text,
          letterSpacing:'-0.03em', textDecoration:'none', flexShrink:0}}>
          Dag<span style={{color:C.accent}}>flux</span>
        </a>
        <div style={{width:1, height:20, background:C.border}}/>
        {/* Tab nav */}
        <div style={{display:'flex', alignItems:'stretch', height:'100%', gap:2}}>
          {TABS.map(t => (
            <button key={t.id} onClick={()=>setTab(t.id)}
              style={{display:'flex', alignItems:'center', padding:'0 14px',
                background:'none', border:'none', cursor:'pointer', fontSize:12,
                fontWeight: tab===t.id ? 600 : 500, fontFamily:SANS,
                color: tab===t.id ? C.text : C.muted,
                borderBottom: tab===t.id ? `2px solid ${C.accent}` : '2px solid transparent',
                transition:'all 0.15s', letterSpacing:'-0.01em'}}>
              {t.label}
            </button>
          ))}
        </div>
        <div style={{flex:1}}/>
        <div style={{display:'flex', alignItems:'center', gap:8}}>
          <div style={{width:24, height:24, borderRadius:'50%', background:C.s2,
            border:`1px solid ${C.border}`, display:'flex', alignItems:'center',
            justifyContent:'center'}}>
            {I('user', C.muted, 12)}
          </div>
          <span style={{fontSize:12, color:C.muted}}>sarah.chen</span>
        </div>
      </div>

      {/* Tab content */}
      <div style={{flex:1, overflow:'hidden'}}>
        {tab==='workflows'   && <WorkflowsTab/>}
        {tab==='executions'  && <ExecutionTab/>}
        {tab==='connections' && <ConnectionsTab/>}
      </div>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
document.getElementById('root').classList.add('ready');
</script>
