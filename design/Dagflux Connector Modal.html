<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dagflux — Connector Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:         #ffffff;
    --surface:    #f7f9fc;
    --s2:         #eef1f6;
    --border:     #e2e6eb;
    --border-2:   #cdd2db;
    --text:       #111827;
    --muted:      #5a6678;
    --dim:        #9ca3af;
    --accent:     #2563eb;
    --aD:         #eff4ff;
    --green:      #059669;
    --amber:      #d97706;
    --red:        #dc2626;
    --violet:     #7c3aed;
    --cyan:       #0891b2;
    --pink:       #db2777;
    --mono:       'JetBrains Mono', monospace;
    --sans:       'Inter', -apple-system, sans-serif;
  }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: #f3f4f6
      radial-gradient(circle at 20% 0%, rgba(37,99,235,0.05), transparent 60%),
      radial-gradient(circle at 100% 100%, rgba(124,58,237,0.04), transparent 50%);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* Subtle dot grid backdrop, matching app canvas */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(#dbe0e8 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }

  /* Modal */
  .modal {
    position: relative; z-index: 2;
    width: min(1040px, 100%);
    max-height: calc(100vh - 48px);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 24px 64px rgba(15,23,42,0.18), 0 2px 8px rgba(15,23,42,0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header — mimic the app's panel-bar */
  .modal-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .panel-dots { display: flex; gap: 5px; }
  .panel-dots span { width: 9px; height: 9px; border-radius: 50%; }
  .dot-r { background: #ff5f57; } .dot-a { background: #ffbd2e; } .dot-g { background: #28ca41; }
  .panel-label {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    color: var(--muted); letter-spacing: 0.02em;
  }
  .panel-status {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11px; color: var(--green);
  }
  .panel-status .pd {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor;
    box-shadow: 0 0 0 3px rgba(5,150,105,0.12);
  }
  .close-btn {
    margin-left: 8px;
    width: 24px; height: 24px; border-radius: 4px;
    border: 1px solid transparent; background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--dim); transition: all 0.12s;
  }
  .close-btn:hover { background: var(--s2); color: var(--text); border-color: var(--border); }

  /* Title row */
  .modal-title {
    padding: 22px 28px 18px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #ffffff 0%, #fafbfd 100%);
  }
  .overline {
    font-family: var(--mono);
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .modal-title h1 {
    font-size: 20px; font-weight: 700;
    letter-spacing: -0.025em; color: var(--text);
    margin-bottom: 4px;
  }
  .modal-title p {
    font-size: 13px; color: var(--muted); line-height: 1.5;
  }

  /* Tabs */
  .tabs {
    display: flex;
    padding: 0 28px;
    border-bottom: 1px solid var(--border);
    background: #fff;
    gap: 0;
    flex-shrink: 0;
  }
  .tab {
    border: none; background: none; cursor: pointer;
    padding: 11px 14px;
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    color: var(--muted);
    display: flex; align-items: center; gap: 8px;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.12s, border-color 0.12s;
    position: relative;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab-count {
    font-family: var(--mono); font-size: 10px;
    background: var(--s2); color: var(--muted);
    padding: 1px 6px; border-radius: 8px;
    line-height: 1.6;
  }
  .tab.active .tab-count { background: var(--aD); color: var(--accent); }

  /* Toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .search {
    flex: 1; position: relative;
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--aD); }
  .search svg { color: var(--dim); flex-shrink: 0; }
  .search input {
    flex: 1; border: none; outline: none; background: transparent;
    font-family: var(--sans); font-size: 13px; color: var(--text);
  }
  .search input::placeholder { color: var(--dim); }
  .kbd {
    font-family: var(--mono); font-size: 10px; color: var(--dim);
    border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 3px;
    background: var(--surface);
  }

  .filter-pills {
    display: flex; gap: 4px;
    background: #fff; border: 1px solid var(--border);
    padding: 3px; border-radius: 6px;
  }
  .pill {
    border: none; background: none; cursor: pointer;
    font-family: var(--sans); font-size: 12px; font-weight: 500;
    color: var(--muted);
    padding: 5px 10px; border-radius: 4px;
    transition: all 0.12s;
  }
  .pill:hover { color: var(--text); }
  .pill.active { background: var(--aD); color: var(--accent); font-weight: 600; }

  /* Body */
  .modal-body {
    flex: 1; overflow-y: auto;
    padding: 22px 28px 24px;
  }

  /* Section header */
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 12px;
    margin-top: 8px;
  }
  .section-head:first-child { margin-top: 0; }
  .section-head h3 {
    font-family: var(--mono);
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .section-head .ct {
    font-family: var(--mono); font-size: 10px;
    color: var(--dim);
    padding: 1px 7px; border-radius: 8px;
    background: var(--s2);
  }
  .section-head .desc {
    font-size: 12px; color: var(--muted);
  }

  /* Connector grid */
  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 1px; background: var(--border);
    border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
    margin-bottom: 22px;
  }
  .card {
    background: #fff;
    padding: 16px 18px;
    cursor: pointer;
    transition: background 0.1s;
    display: grid; grid-template-columns: 44px 1fr auto;
    gap: 14px; align-items: flex-start;
    position: relative;
    min-height: 80px;
  }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card:hover { background: var(--surface); }
  .card.disabled { cursor: default; opacity: 0.85; }

  .card .ico {
    width: 44px; height: 44px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
    margin-top: 2px;
    transition: border-color 0.12s;
  }
  .card:hover .ico { border-color: var(--border-2); }
  .card .ico img { width: 28px; height: 28px; object-fit: contain; }
  .card .ico .letters {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: 0.04em;
  }

  .card .info { min-width: 0; padding-top: 1px; }
  .card .info .row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 5px;
    flex-wrap: wrap;
  }
  .card .name {
    font-size: 13.5px; font-weight: 600; color: var(--text);
    letter-spacing: -0.01em;
  }
  .card .desc {
    font-size: 12px; color: var(--muted); line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Status tag (mono) */
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--mono); font-size: 9.5px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 3px;
    line-height: 1.5;
    flex-shrink: 0;
  }
  .tag-ready  { color: var(--green); background: rgba(5,150,105,0.08); border: 1px solid rgba(5,150,105,0.22); }
  .tag-installed { color: var(--accent); background: rgba(37,99,235,0.08); border: 1px solid rgba(37,99,235,0.22); }
  .tag-need   { color: var(--amber); background: rgba(217,119,6,0.08); border: 1px solid rgba(217,119,6,0.25); }
  .tag-dim    { color: var(--muted); background: var(--s2); border: 1px solid var(--border); }
  .tag-installing { color: var(--violet); background: rgba(124,58,237,0.08); border: 1px solid rgba(124,58,237,0.22); }
  .tag .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  /* Action button on card right */
  .card .actions {
    display: flex; align-items: center; gap: 6px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .btn-card {
    border: 1px solid var(--border-2);
    background: #fff;
    color: var(--muted);
    font-family: var(--sans); font-size: 11.5px; font-weight: 500;
    padding: 5px 10px; border-radius: 4px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    transition: all 0.12s;
  }
  .btn-card:hover { border-color: var(--text); color: var(--text); }
  .btn-card.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    font-weight: 600;
  }
  .btn-card.primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
  .btn-card.installing { color: var(--violet); border-color: rgba(124,58,237,0.35); cursor: progress; }
  .btn-card svg { flex-shrink: 0; }

  .card.disabled .name { color: var(--muted); }

  /* Skills tab */
  .skill-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    transition: border-color 0.12s, box-shadow 0.12s;
    cursor: pointer;
    position: relative;
  }
  .skill-card:hover { border-color: var(--violet); box-shadow: 0 4px 14px rgba(124,58,237,0.08); }
  .skill-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .skill-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .skill-ico {
    width: 36px; height: 36px; border-radius: 6px;
    background: linear-gradient(135deg, rgba(124,58,237,0.1), rgba(37,99,235,0.08));
    border: 1px solid rgba(124,58,237,0.18);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: var(--violet);
  }
  .skill-head .name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; letter-spacing: -0.01em; }
  .skill-head .cat { font-family: var(--mono); font-size: 10px; color: var(--violet); letter-spacing: 0.06em; text-transform: uppercase; }
  .skill-card .body { font-size: 12px; color: var(--muted); line-height: 1.55; margin-bottom: 12px; }
  .skill-meta {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 10px; color: var(--dim);
    padding-top: 10px; border-top: 1px dashed var(--border);
  }
  .skill-meta .item { display: flex; align-items: center; gap: 4px; }

  /* Footer */
  .modal-foot {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 28px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .foot-info {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    display: flex; align-items: center; gap: 14px;
  }
  .foot-info .it { display: flex; align-items: center; gap: 6px; }
  .foot-info svg { color: var(--dim); }
  .foot-spacer { flex: 1; }
  .btn-ghost {
    border: 1px solid var(--border-2);
    background: #fff;
    color: var(--muted);
    font-family: var(--sans); font-size: 12.5px; font-weight: 500;
    padding: 6px 14px; border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--text); }

  /* Empty state */
  .empty {
    text-align: center; padding: 60px 20px;
    color: var(--muted);
  }
  .empty .glyph {
    width: 56px; height: 56px; margin: 0 auto 14px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px dashed var(--border-2);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim);
  }
  .empty h4 { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .empty p { font-size: 12.5px; line-height: 1.6; max-width: 320px; margin: 0 auto; }

  /* Hidden helper */
  .hidden { display: none !important; }

  /* Animation for installing dots */
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  .dots span {
    display: inline-block; width: 3px; height: 3px; border-radius: 50%;
    background: currentColor; margin: 0 1px;
    animation: blink 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.18s; }
  .dots span:nth-child(3) { animation-delay: 0.36s; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--dim); }
</style>
</head>
<body>

<div class="modal" data-screen-label="Connector Picker Modal">
  <!-- Window chrome / header -->
  <div class="modal-head">
    <div class="panel-dots"><span class="dot-r"></span><span class="dot-a"></span><span class="dot-g"></span></div>
    <span class="panel-label">dagflux / workflow / add-source</span>
    <div class="panel-status">
      <span class="pd"></span>
      <span>registry-online</span>
    </div>
    <button class="close-btn" aria-label="Close" id="closeBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <!-- Title -->
  <div class="modal-title">
    <span class="overline">Add Connector</span>
    <h1>Plugins &amp; Skills</h1>
    <p>Connect a data source, cloud storage, or attach a transform skill to your workflow.</p>
  </div>

  <!-- Tabs -->
  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="connectors" role="tab">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></svg>
      Connectors <span class="tab-count" id="tabCountConn">25</span>
    </button>
    <button class="tab" data-tab="skills" role="tab">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13,2 3,14 12,14 11,22 21,10 12,10 13,2"/></svg>
      Skills <span class="tab-count" id="tabCountSkill">5</span>
    </button>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="Search connectors, formats, or providers…" autocomplete="off"/>
      <span class="kbd">⌘K</span>
    </div>
    <div class="filter-pills" id="filterPills">
      <button class="pill active" data-filter="all">All</button>
      <button class="pill" data-filter="installed">Installed</button>
      <button class="pill" data-filter="available">Available</button>
    </div>
  </div>

  <!-- Body -->
  <div class="modal-body" id="modalBody">
    <!-- Connectors tab content rendered here -->
    <div id="connectorsPane"></div>
    <div id="skillsPane" class="hidden"></div>
  </div>

  <!-- Footer -->
  <div class="modal-foot">
    <div class="foot-info">
      <span class="it">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
        registry synced 2 min ago
      </span>
      <span class="it">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        signed plugins only
      </span>
    </div>
    <div class="foot-spacer"></div>
    <button class="btn-ghost" id="cancelBtn">Cancel</button>
  </div>
</div>

<script>
// ── Connector catalog ───────────────────────────────────────────
const LOGOS = 'integration_logos/';
const CONNECTORS = [
  // FILES
  { key:'spreadsheet', title:'CSV / Excel',     desc:'Import CSV or XLSX into local SQLite store', cat:'file', img:LOGOS+'CSV.png',                installed:true, fileBased:true },
  { key:'json',        title:'JSON',            desc:'Import JSON documents into local NeDB',      cat:'file', img:LOGOS+'JSON.png',               installed:true, fileBased:true },
  { key:'sqlite',      title:'SQLite',          desc:'Open an existing .sqlite database file',     cat:'file', letters:'SQ', tone:'#0f80cc',       installed:true, fileBased:true },
  { key:'parquet',     title:'Parquet',         desc:'Columnar Apache Parquet files',              cat:'file', letters:'PQ', tone:'#9254de',       installed:true, fileBased:true },
  { key:'avro',        title:'Avro',            desc:'Row-oriented Apache Avro files',             cat:'file', letters:'AV', tone:'#eb2f96',       installed:true, fileBased:true },
  { key:'lancedb',     title:'LanceDB',         desc:'Local LanceDB vector store',                 cat:'file', letters:'LN', tone:'#7c3aed',       installed:true, fileBased:true, img:LOGOS+'LanceDB.png' },

  // DATABASES
  { key:'postgres',    title:'PostgreSQL',      desc:'Connect to a PostgreSQL database',           cat:'database', img:LOGOS+'PostgreSQL.png',          installed:true },
  { key:'mysql',       title:'MySQL / MariaDB', desc:'Connect to MySQL or MariaDB',                cat:'database', img:LOGOS+'MySQL.png',               installed:true },
  { key:'mssql',       title:'SQL Server',      desc:'Microsoft SQL Server connection',            cat:'database', img:LOGOS+'Microsoft_SQL_Server.png',installed:false },
  { key:'mongodb',     title:'MongoDB',         desc:'MongoDB or Atlas cluster',                   cat:'database', img:LOGOS+'MongoDB.png',             installed:true },
  { key:'redshift',    title:'Amazon Redshift', desc:'Redshift data warehouse',                    cat:'database', img:LOGOS+'Amazon_Redshift.png',     installed:false },
  { key:'bigquery',    title:'Google BigQuery', desc:'BigQuery data warehouse',                    cat:'database', img:LOGOS+'Google_BigQuery.png',     installed:true },
  { key:'snowflake',   title:'Snowflake',       desc:'Snowflake data warehouse',                   cat:'database', img:LOGOS+'Snowflake.png',           installed:false },

  // STORAGE
  { key:'s3',          title:'Amazon S3',       desc:'S3 object storage buckets',                  cat:'storage', img:LOGOS+'Amazon_S3.png',           installed:true },
  { key:'gcs',         title:'Google Cloud Storage', desc:'GCS buckets',                           cat:'storage', img:LOGOS+'Google_Cloud_Storage.png',installed:false },
  { key:'azure-blob',  title:'Azure Blob Storage',   desc:'Azure container storage',               cat:'storage', img:LOGOS+'Azure_blob.png',          installed:false },
  { key:'dropbox',     title:'Dropbox',         desc:'Dropbox cloud storage',                      cat:'storage', letters:'DB', tone:'#0061ff',       installed:false },
  { key:'google-drive',title:'Google Drive',    desc:'Google Drive folders & files',               cat:'storage', letters:'GD', tone:'#34a853',       installed:false },
  { key:'onedrive',    title:'OneDrive',        desc:'Microsoft OneDrive',                         cat:'storage', letters:'OD', tone:'#0078d4',       installed:false },

  // API
  { key:'google-sheets', title:'Google Sheets', desc:'Sheets via OAuth 2.0',                       cat:'api',     img:LOGOS+'Google_Sheets.png',       installed:true },
  { key:'rest-api',      title:'REST API',      desc:'Generic HTTP endpoint with auth',            cat:'api',     letters:'API', tone:'#2563eb',      installed:true },
  { key:'hubspot',       title:'HubSpot',       desc:'HubSpot CRM API',                            cat:'api',     img:LOGOS+'HubSpot.png',             installed:false },
  { key:'salesforce',    title:'Salesforce',    desc:'Salesforce SOQL & REST API',                 cat:'api',     img:LOGOS+'Salesforce.png',          installed:false },

  // VECTOR
  { key:'pinecone',    title:'Pinecone',        desc:'Pinecone vector database',                   cat:'vector', letters:'PC', tone:'#0f172a',       installed:false },
];

const SECTIONS = [
  { cat:'file',     title:'Local Files',         desc:'Files imported into a local store on first run' },
  { cat:'database', title:'Database Connections',desc:'Live JDBC / native driver connections' },
  { cat:'storage',  title:'Cloud Storage',       desc:'Object stores and personal drives' },
  { cat:'api',      title:'API Connectors',      desc:'OAuth & token-based service APIs' },
  { cat:'vector',   title:'Vector Databases',    desc:'Embedding stores for AI workflows' },
];

const SKILLS = [
  { id:'pii-redact',   name:'PII Redaction',      cat:'transformer', desc:'Detect and redact emails, SSNs, phone numbers and credit-card patterns from text columns.', size:'128 KB', author:'dagflux/core' },
  { id:'date-norm',    name:'Date Normalizer',    cat:'transformer', desc:'Normalize mixed date strings into ISO-8601 with timezone preservation.',                    size:'42 KB',  author:'dagflux/core' },
  { id:'currency-fx',  name:'Currency FX',        cat:'enricher',    desc:'Convert monetary columns to a target currency using daily ECB rates.',                     size:'56 KB',  author:'dagflux/core' },
  { id:'geo-resolve',  name:'Geo Resolver',       cat:'enricher',    desc:'Resolve postal codes and IP addresses to country, region and city.',                       size:'1.4 MB', author:'community' },
  { id:'embed-text',   name:'Text Embedder',      cat:'ai',          desc:'Generate sentence embeddings via local model — outputs 768-dim vectors.',                  size:'18 MB',  author:'dagflux/core' },
];

// ── State ───────────────────────────────────────────────────────
const state = {
  tab: 'connectors',
  search: '',
  filter: 'all',
  installing: new Set(),
  installed: new Set(CONNECTORS.filter(c=>c.installed).map(c=>c.key)),
};

// ── Render helpers ──────────────────────────────────────────────
function iconHTML(c) {
  if (c.img) return `<div class="ico"><img src="${c.img}" alt="${c.title}" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=\\'letters\\' style=\\'color:${c.tone||'#5a6678'}\\'>'+\`${(c.letters||c.title.slice(0,2).toUpperCase())}\`+'</span>'"/></div>`;
  return `<div class="ico"><span class="letters" style="color:${c.tone||'#5a6678'}">${c.letters||c.title.slice(0,2).toUpperCase()}</span></div>`;
}

function statusTag(c) {
  if (state.installing.has(c.key)) {
    return `<span class="tag tag-installing"><span class="dots"><span></span><span></span><span></span></span> Installing</span>`;
  }
  if (c.fileBased) {
    return `<span class="tag tag-ready"><span class="dot"></span> Ready</span>`;
  }
  if (state.installed.has(c.key)) {
    return `<span class="tag tag-installed"><span class="dot"></span> Installed</span>`;
  }
  return `<span class="tag tag-need">Plugin Required</span>`;
}

function actionBtn(c) {
  if (state.installing.has(c.key)) {
    return `<button class="btn-card installing" disabled>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      Installing
    </button>`;
  }
  if (c.fileBased || state.installed.has(c.key)) {
    return `<button class="btn-card primary" data-action="select" data-key="${c.key}">
      Select
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9,18 15,12 9,6"/></svg>
    </button>`;
  }
  return `<button class="btn-card" data-action="install" data-key="${c.key}">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Install
  </button>`;
}

function cardHTML(c) {
  const isInstalled = c.fileBased || state.installed.has(c.key);
  return `
    <div class="card ${!isInstalled && !state.installing.has(c.key) ? 'available' : ''}" data-key="${c.key}">
      ${iconHTML(c)}
      <div class="info">
        <div class="row">
          <span class="name">${c.title}</span>
          ${statusTag(c)}
        </div>
        <div class="desc">${c.desc}</div>
      </div>
      <div class="actions">${actionBtn(c)}</div>
    </div>
  `;
}

function filterConnectors() {
  const q = state.search.trim().toLowerCase();
  return CONNECTORS.filter(c => {
    const matchesQ = !q || c.title.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q) || c.key.toLowerCase().includes(q);
    if (!matchesQ) return false;
    if (state.filter === 'installed') return c.fileBased || state.installed.has(c.key);
    if (state.filter === 'available')  return !c.fileBased && !state.installed.has(c.key);
    return true;
  });
}

function renderConnectors() {
  const pane = document.getElementById('connectorsPane');
  const list = filterConnectors();
  if (list.length === 0) {
    pane.innerHTML = `
      <div class="empty">
        <div class="glyph">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
        <h4>No connectors match</h4>
        <p>Try a different search term, or clear filters to browse the full registry.</p>
      </div>`;
    return;
  }
  let html = '';
  for (const sec of SECTIONS) {
    const items = list.filter(c => c.cat === sec.cat);
    if (items.length === 0) continue;
    html += `
      <div class="section-head">
        <h3>${sec.title} <span class="ct">${items.length}</span></h3>
        <span class="desc">${sec.desc}</span>
      </div>
      <div class="grid">${items.map(cardHTML).join('')}</div>
    `;
  }
  pane.innerHTML = html;

  // wire actions
  pane.querySelectorAll('[data-action="install"]').forEach(b => {
    b.addEventListener('click', e => { e.stopPropagation(); install(b.dataset.key); });
  });
  pane.querySelectorAll('[data-action="select"]').forEach(b => {
    b.addEventListener('click', e => { e.stopPropagation(); select(b.dataset.key); });
  });
  pane.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const k = card.dataset.key;
      const c = CONNECTORS.find(x => x.key === k);
      if (c.fileBased || state.installed.has(k)) select(k);
    });
  });

  // counts
  document.getElementById('tabCountConn').textContent = list.length;
}

function renderSkills() {
  const pane = document.getElementById('skillsPane');
  const q = state.search.trim().toLowerCase();
  const items = SKILLS.filter(s => !q || s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q) || s.cat.includes(q));
  if (items.length === 0) {
    pane.innerHTML = `
      <div class="empty">
        <div class="glyph">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13,2 3,14 12,14 11,22 21,10 12,10 13,2"/></svg>
        </div>
        <h4>No skills match</h4>
        <p>Skills extend transform nodes with reusable logic — try clearing the search.</p>
      </div>`;
    return;
  }
  pane.innerHTML = `
    <div class="section-head">
      <h3>Installed Skills <span class="ct">${items.length}</span></h3>
      <span class="desc">Drag a skill onto a transform node to attach it</span>
    </div>
    <div class="skill-grid">
      ${items.map(s => `
        <div class="skill-card" data-skill="${s.id}">
          <div class="skill-head">
            <div class="skill-ico">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13,2 3,14 12,14 11,22 21,10 12,10 13,2"/></svg>
            </div>
            <div>
              <div class="name">${s.name}</div>
              <div class="cat">${s.cat}</div>
            </div>
          </div>
          <div class="body">${s.desc}</div>
          <div class="skill-meta">
            <span class="item">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              ${s.size}
            </span>
            <span class="item">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              ${s.author}
            </span>
          </div>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('tabCountSkill').textContent = SKILLS.length;
}

// ── Actions ─────────────────────────────────────────────────────
function install(key) {
  if (state.installing.has(key)) return;
  state.installing.add(key);
  renderConnectors();
  // simulated install
  setTimeout(() => {
    state.installing.delete(key);
    state.installed.add(key);
    renderConnectors();
  }, 1400);
}
function select(key) {
  const c = CONNECTORS.find(x => x.key === key);
  // visual feedback — flash the card
  const card = document.querySelector(`.card[data-key="${key}"]`);
  if (card) {
    card.style.transition = 'background 0.18s';
    card.style.background = 'var(--aD)';
    setTimeout(() => card.style.background = '', 280);
  }
  console.log('[connector picker] selected:', key, c.title);
}

// ── Wire UI ─────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    state.tab = t.dataset.tab;
    document.getElementById('connectorsPane').classList.toggle('hidden', state.tab !== 'connectors');
    document.getElementById('skillsPane').classList.toggle('hidden', state.tab !== 'skills');
    document.getElementById('filterPills').style.visibility = state.tab === 'connectors' ? 'visible' : 'hidden';
    if (state.tab === 'skills') renderSkills(); else renderConnectors();
  });
});
document.querySelectorAll('.pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    state.filter = p.dataset.filter;
    renderConnectors();
  });
});
const searchEl = document.getElementById('searchInput');
searchEl.addEventListener('input', e => {
  state.search = e.target.value;
  if (state.tab === 'connectors') renderConnectors(); else renderSkills();
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault(); searchEl.focus();
  }
  if (e.key === 'Escape') { searchEl.blur(); }
});

document.getElementById('closeBtn').addEventListener('click', () => console.log('close'));
document.getElementById('cancelBtn').addEventListener('click', () => console.log('cancel'));

// initial counts
document.getElementById('tabCountConn').textContent = CONNECTORS.length;
document.getElementById('tabCountSkill').textContent = SKILLS.length;

// initial render
renderConnectors();
renderSkills();
</script>

</body>
</html>
